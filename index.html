<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firman's Links</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffffff,#f0f0f0);
    overflow:hidden;
    position:relative;
}

.container{
    text-align:center;
    width:90%;
    max-width:400px;
    z-index:10;
}

.profile{
    width:180px;
    height:180px;
    border-radius:50%;
    object-fit:cover;
    border:6px solid white;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    margin-bottom:20px;
}

h1{
    color:#222;
    margin-bottom:10px;
    font-size:38px;
}

p{
    color:#666;
    margin-bottom:35px;
    font-size:20px;
}

.btn{
    display:block;
    text-decoration:none;
    padding:18px;
    margin:15px 0;
    border-radius:15px;
    color:white;
    font-size:18px;
    font-weight:bold;
    transition:0.3s;
}

.btn:hover{
    transform:translateY(-5px);
}

.ig{
    background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af,#515bd4);
}

.tt{
    background:#000;
}

.circle{
    position:absolute;
    border-radius:50%;
    opacity:0.1;
}

.c1{
    width:250px;
    height:250px;
    background:#000;
    top:-50px;
    left:-50px;
}

.c2{
    width:300px;
    height:300px;
    background:#555;
    bottom:-100px;
    right:-100px;
}
</style>
</head>

<body>

<div class="circle c1"></div>
<div class="circle c2"></div>

<div class="container">

    <img src="https://raw.githubusercontent.com/Firmansyah47/Firman/main/Elainaa.jpg" class="profile">

    <h1>Welcome My Profile👋</h1>
    <p>Choice </p>

    <a class="btn ig"
    href="https://www.instagram.com/firmann_47?igsh=MTk4bG03a3JmZmpuNA=="
    target="_blank">
    📸 GO INSTAGRAM
    </a>

    <a class="btn tt"
    href="https://www.tiktok.com/@firman_1447?_r=1&_t=ZS-975EdQIUgqO"
    target="_blank">
    🎵 GO TIKTOK
    </a>

</div>

</body>
</html>
