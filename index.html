<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Kamu Nindy Sayaang❤️</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
    overflow:hidden;
}

.container{
    background:white;
    padding:30px;
    border-radius:20px;
    max-width:600px;
    width:90%;
    box-shadow:0 0 20px rgba(0,0,0,0.2);
}

h1{
    color:#ff4d6d;
}

#message{
    font-size:20px;
    margin:20px 0;
    min-height:120px;
}

button{
    background:#ff4d6d;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    transform:scale(1.05);
}

.heart{
    position:absolute;
    color:red;
    animation:fall 5s linear infinite;
}

@keyframes fall{
    from{
        transform:translateY(-100px);
    }
    to{
        transform:translateY(100vh);
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>❤️ Untuk Kamu ❤️</h1>

    <div id="message">
        Ada sesuatu yang ingin aku sampaikan...
    </div>

    <button onclick="nextMessage()">Buka Pesan</button>
</div>

<script>

const messages = [
"Kalau kamu lagi capek, istirahatlah. Kamu nggak harus kuat setiap saat ❤️",

"Aku bangga sama kamu karena sudah bertahan sejauh ini.",

"Mungkin hari-harimu nggak selalu mudah, tapi kamu selalu berhasil melewatinya.",

"Terima kasih sudah hadir di hidupku.",

"Terima kasih untuk setiap tawa, cerita, dan perhatian kecil yang kamu berikan.",

"Kalau suatu saat kamu merasa sendirian, ingat ada seseorang yang selalu peduli sama kamu.",

"Aku suka cara kamu tersenyum.",

"Aku suka cara kamu menjadi dirimu sendiri.",

"Dan aku harap kamu selalu percaya kalau kamu berharga.",

"Karena buat aku, kamu adalah salah satu hal terbaik yang pernah hadir ❤️",

"✨ THE END ✨\n\nAku sayang kamu lebih dari yang bisa dijelaskan kata-kata ❤️"
];

let index = 0;

function nextMessage(){
    if(index < messages.length){
        document.getElementById("message").innerText = messages[index];
        index++;
    }
}

function createHeart(){
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";
    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = (20 + Math.random()*30) + "px";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },5000);
}

setInterval(createHeart,300);

</script>

</body>
</html>
