<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>MBG BUAT KAMU😁</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .box {
      width: 200px;
      height: 200px;
      background: #ff4d6d;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      transition: 0.3s;
    }

    .box:hover {
      transform: scale(1.05);
    }

    .box h2 {
      color: white;
      text-align: center;
    }

    .gift {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
    }

    .gift img {
      width: 250px;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    .gift button {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #ff4d6d;
      color: white;
    }
  </style>
</head>
<body>

  <div class="box" onclick="openGift()">
    <h2>Klik Hadiah 🎁</h2>
  </div>

  <div class="gift" id="gift">
    <img src="https://ibb.co.com/GQQ2gm21?web_source=router" alt="foto">
    <h2>Ini hadiah buat kamu 💖</h2>
    <p>Semoga kamu suka ya 🤭</p>
    <button onclick="closeGift()">Tutup</button>
  </div>

  <script>
    function openGift() {
      document.getElementById("gift").style.display = "flex";
    }

    function closeGift() {
      document.getElementById("gift").style.display = "none";
    }
  </script>

</body>
</html>
