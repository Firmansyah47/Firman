<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBG rasa durian 🤤</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9ecf,#ffc7e3);
    overflow:hidden;
}

.box{
    text-align:center;
}

h1{
    color:white;
    font-size:32px;
    margin-bottom:30px;
    text-shadow:2px 2px 10px rgba(0,0,0,0.2);
}

.tombol{
    display:flex;
    justify-content:center;
    gap:15px;
}

button{
    padding:12px 28px;
    border:none;
    border-radius:15px;
    font-size:18px;
    cursor:pointer;
}

#yes{
    background:#ff4f9f;
    color:white;
}

#no{
    background:white;
    color:#ff4f9f;
    position:fixed;
}
</style>
</head>

<body>

<div class="box">
    <h1>Kamu suka aku ga? ❤️</h1>

    <div class="tombol">
        <button id="yes">Iya ❤️</button>
        <button id="no">Malas🧢</button>
    </div>
</div>

<script>
const noBtn = document.getElementById("no");

// posisi awal tombol Malas
noBtn.style.left = "55%";
noBtn.style.top = "55%";

function kabur() {
    const x = Math.random() * (window.innerWidth - 120);
    const y = Math.random() * (window.innerHeight - 60);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

noBtn.addEventListener("mouseover", kabur);
noBtn.addEventListener("touchstart", kabur);
noBtn.addEventListener("click", kabur);

document.getElementById("yes").addEventListener("click", function() {

    const nomor = "6285183376722";

    const pesan = encodeURIComponent(
        "Iyaa aku suka banget sama kamu, kamu mau ga jadi pacar aku💕❤✨"
    );

    window.open(
        `https://api.whatsapp.com/send?phone=${nomor}&text=${pesan}`,
        "_blank"
    );
});
</script>

</body>
</html>
