<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎁 HADIAH BUAT KAMU 🎁</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 500px;
      animation: slideIn 0.8s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      color: white;
      font-size: 2.5em;
      margin-bottom: 30px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .button-container {
      perspective: 1000px;
    }

    .gift-button {
      width: 280px;
      height: 280px;
      background: linear-gradient(135deg, #ff6b9d 0%, #ff1493 100%);
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-size: 4em;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3), inset 0 -4px 0 rgba(0,0,0,0.2);
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 30px auto;
      position: relative;
      overflow: hidden;
    }

    .gift-button::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
      animation: shine 3s infinite;
    }

    @keyframes shine {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .gift-button:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4), inset 0 -4px 0 rgba(0,0,0,0.2);
    }

    .gift-button:active {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3), inset 0 -2px 0 rgba(0,0,0,0.2);
    }

    .button-text {
      position: relative;
      z-index: 1;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      line-height: 1.2;
    }

    .button-text span {
      display: block;
      font-size: 0.4em;
      margin-top: 10px;
      font-weight: bold;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      animation: fadeIn 0.3s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal.show {
      display: flex !important;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      position: relative;
      text-align: center;
      animation: popIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.3) rotateZ(-20deg);
      }
      to {
        opacity: 1;
        transform: scale(1) rotateZ(0);
      }
    }

    .modal img {
      max-width: 85vw;
      max-height: 70vh;
      border-radius: 20px;
      box-shadow: 0 0 60px rgba(255, 107, 157, 0.5);
      cursor: pointer;
      border: 4px solid #ff6b9d;
      transition: transform 0.3s ease;
    }

    .modal img:hover {
      transform: scale(1.05);
    }

    .modal-text {
      color: white;
      margin-top: 30px;
      font-size: 1.5em;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .modal-text h2 {
      margin-bottom: 10px;
      font-size: 1.8em;
    }

    .modal-text p {
      font-size: 1.1em;
      margin: 8px 0;
    }

    .close-btn {
      position: absolute;
      top: 30px;
      right: 50px;
      color: white;
      font-size: 2.5em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      text-shadow: 0 0 10px rgba(0,0,0,0.7);
      z-index: 1001;
    }

    .close-btn:hover {
      color: #ff6b9d;
      transform: rotate(90deg) scale(1.2);
    }

    .instruction {
      color: rgba(255, 255, 255, 0.8);
      margin-top: 20px;
      font-size: 1em;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2em;
      }

      .gift-button {
        width: 220px;
        height: 220px;
        font-size: 3em;
      }

      .close-btn {
        right: 20px;
        font-size: 2em;
      }

      .modal img {
        max-width: 95vw;
        max-height: 60vh;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎉 HADIAH SPESIAL 🎉</h1>
    
    <div class="button-container">
      <button class="gift-button" onclick="openGift()">
        <div class="button-text">
          🎁
          <span>KLIK!</span>
        </div>
      </button>
    </div>

    <p class="instruction">👆 Tekan kotak hadiah untuk melihat kejutan!</p>
  </div>

  <!-- Modal untuk menampilkan foto -->
  <div id="photoModal" class="modal">
    <span class="close-btn" onclick="closeGift()">&times;</span>
    <div class="modal-content">
      <img id="modalImage" src="d164012ae0c566d59c3dac79f8f6bd6c.jpg" alt="Hadiah Spesial" onclick="enlargeImage(this)">
      <div class="modal-text">
        <h2>🎊 KEJUTAN! 🎊</h2>
        <p>Semoga kamu suka ya! 💖</p>
        <p style="font-size: 0.9em; margin-top: 15px;">Klik gambar untuk perbesar/perkecil</p>
      </div>
    </div>
  </div>

  <script>
    function openGift() {
      const modal = document.getElementById("photoModal");
      modal.classList.add("show");
    }

    function closeGift() {
      const modal = document.getElementById("photoModal");
      modal.classList.remove("show");
      // Reset ukuran gambar
      document.getElementById("modalImage").style.maxHeight = "70vh";
    }

    function enlargeImage(img) {
      if (img.style.maxHeight === "85vh") {
        img.style.maxHeight = "70vh";
      } else {
        img.style.maxHeight = "85vh";
      }
    }

    // Tutup modal jika klik di area luar konten
    document.getElementById("photoModal").addEventListener("click", function(e) {
      if (e.target === this) {
        closeGift();
      }
    });

    // Tutup modal dengan tombol Escape
    document.addEventListener("keydown", function(e) {
      if (e.key === "Escape") {
        closeGift();
      }
    });
  </script>

</body>
</html>
