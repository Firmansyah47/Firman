<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Nindy Dari Firman 🎁❤</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container { text-align: center; color: white; padding: 20px; }
        h1 { font-size: 2rem; margin-bottom: 10px; animation: fadeIn 2s; }
        .subtitle { font-size: 1.1rem; margin-bottom: 30px; opacity: 0.9; animation: fadeIn 2s 0.5s both; }
        
        .gift-box {
            width: 200px; height: 200px;
            margin: 0 auto 30px;
            position: relative;
            cursor: pointer;
            animation: bounce 2s infinite;
        }
        .box {
            width: 100%; height: 100%;
            background: #ff6b6b;
            border-radius: 10px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .lid {
            width: 220px; height: 50px;
            background: #ee5a6f;
            position: absolute;
            top: -25px; left: -10px;
            border-radius: 5px;
            transition: all 0.5s;
        }
        .ribbon {
            width: 30px; height: 200px;
            background: #feca57;
            position: absolute;
            left: 50%; transform: translateX(-50%);
        }
        .ribbon-2 {
            width: 200px; height: 30px;
            background: #feca57;
            position: absolute;
            top: 50%; transform: translateY(-50%);
        }
        
        .gift-box.open .lid {
            top: -80px;
            transform: rotate(-20deg);
        }
        
        .message {
            display: none;
            font-size: 1.3rem;
            animation: fadeIn 1s;
            max-width: 90%;
            margin: 0 auto;
            line-height: 1.8;
        }
        .message.show { display: block; }
        .message p { margin-bottom: 10px; }
        .from { margin-top: 25px; font-weight: bold; font-size: 1.1rem; }
        
        button {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            background: white;
            color: #667eea;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        button:active { transform: scale(0.95); }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .heart {
            position: absolute;
            font-size: 20px;
            animation: fall 3s linear infinite;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="judul">Hai Nindy 👋</h1>
        <p class="subtitle">Firman punya hadiah buat kamu</p>
        <div class="gift-box" onclick="bukaHadiah()">
            <div class="lid"></div>
            <div class="box">
                <div class="ribbon"></div>
                <div class="ribbon-2"></div>
            </div>
        </div>
        <div class="message" id="pesan">
            <p>Nindy, makasih ya udah hadir di hidupku ❤️</p>
            <p>Setiap hari sama kamu itu selalu spesial</p>
            <p>Kamu hadiah terindah yang pernah aku punya</p>
            <p class="from">- Firman -</p>
        </div>
        <button onclick="bukaHadiah()" id="tombol">Buka Hadiahnya</button>
    </div>

    <script>
        let sudahBuka = false;
        function bukaHadiah() {
            if (sudahBuka) return;
            sudahBuka = true;
            
            document.querySelector('.gift-box').classList.add('open');
            document.getElementById('pesan').classList.add('show');
            document.getElementById('judul').innerText = 'Untuk Nindy 🎉';
            document.querySelector('.subtitle').style.display = 'none';
            document.getElementById('tombol').style.display = 'none';
            
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    let heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.innerHTML = '❤️';
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.animationDelay = Math.random() * 2 + 's';
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 3000);
                }, i * 100);
            }
        }
    </script>
</body>
</html>
