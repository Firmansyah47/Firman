‎<!DOCTYPE html>
‎<html lang="id">
‎<head>
‎    <meta charset="UTF-8">
‎    <meta name="viewport" content="width=device-width, initial-scale=1.0">
‎    <title>Nindy</title>
‎    <style>
‎        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300&family=Dancing+Script:wght@700&display=swap');
‎        * { margin: 0; padding: 0; box-sizing: border-box; }
‎        body {
‎            background: #0d0d0d;
‎            color: #fff;
‎            font-family: 'Poppins', sans-serif;
‎            height: 100vh;
‎            display: flex;
‎            justify-content: center;
‎            align-items: center;
‎            overflow: hidden;
‎        }
‎        #entrance {
‎            text-align: center;
‎            cursor: pointer;
‎            transition: all 0.8s ease;
‎        }
‎        #entrance.hide {
‎            opacity: 0;
‎            transform: scale(1.2);
‎            pointer-events: none;}
‎        #entrance h1 {
‎            font-family: 'Dancing Script', cursive;
‎            font-size: 4rem;
‎            color: #ff4d6d;
‎            text-shadow: 0 0 30px rgba(255, 77, 109, 0.8);
‎            animation: glow 2s infinite alternate;
‎        }
‎        #entrance p {
‎            margin-top: 10px;
‎            color: #888;
‎            font-size: 0.9rem;
‎        }
‎        @keyframes glow {
‎            from { text-shadow: 0 0 20px rgba(255, 77, 109, 0.5); }
‎            to { text-shadow: 0 0 40px rgba(255, 77, 109, 1); }
‎        }
‎        #letter {
‎            display: none;
‎            max-width: 80%;
‎            opacity: 0;
‎            transition: opacity 1s ease;
‎        }
‎        #letter.show {
‎            display: block;
‎            opacity: 1;
‎        }
‎        #text {
‎            font-size: 1.1rem;
‎            line-height: 1.9;
‎            color: #e4e4e4;
‎            white-space: pre-wrap;
‎        }
‎        #text::after {
‎            content: '|';
‎            animation: blink 0.7s infinite;
‎            color: #ff4d6d;
‎        }
‎        @keyframes blink {
‎            50% { opacity: 0; }
‎        }
‎        .highlight {
‎            color: #ff4d6d;
‎            font-weight: 400;
‎        }
‎    </style>
‎</head>
‎<body>
‎    <div id="entrance">
‎        <h1>Nindy</h1>
‎        <p>sentuh namaku</p>
‎    </div>
‎    <div id="letter">
‎        <div id="text"></div>
‎    </div>
‎    <script>
‎        document.getElementById('entrance').addEventListener('click', function() {
‎            this.classList.add('hide');
‎            setTimeout(() => {
‎                this.style.display = 'none';
    document.getElementById('letter').classList.add('show');
‎                ketikCepet();
‎            }, 800);
‎        });
‎        const isiSurat = `Hai kamu...\n\nGak tau harus mulai dari mana.\n\nAku cuma mau kamu tau satu hal:\n<span class="highlight">Aku sayang sama kamu.</span>\n\nBukan sayang yang main-main.\nSayang yang bikin aku mikir kamu tiap hari.\nSayang yang bikin aku takut kehilangan.\n\nMaaf ya kalo aku sering bikin kesel.\nMaaf kalo aku egois dan banyak kurangnya.\n\nTapi sumpah, aku lagi belajar.\nBelajar jadi yang pantes buat kamu.\n\nKamu itu rumah. Tempat aku pulang.\nDan aku gak mau rumah itu pergi.\n\nJadi... boleh ya aku tetep sayang kamu?\n\n<span class="highlight">Selamanya.</span>`;
‎        let index = 0;
‎        const speed = 25;
‎        function ketikCepet() {
‎            if (index < isiSurat.length) {
‎                if (isiSurat.charAt(index) === '<') {
‎                    let tag = '';
‎                    while (isiSurat.charAt(index) !== '>') {
‎                        tag += isiSurat.charAt(index);
‎                        index++;
‎                    }
‎                    tag += '>';
‎                    document.getElementById('text').innerHTML += tag;
‎                    index++;
‎                } else {
‎                    document.getElementById('text').innerHTML += isiSurat.charAt(index);
‎                    index++;
‎                }
‎                setTimeout(ketikCepet, speed);
‎            }
‎        }
‎    </script>
‎</body>
‎</html>
