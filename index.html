<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mbg Rasa Durian🤤</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9ecf,#ffc7e3);
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.box{
    text-align:center;
}

h1{
    color:white;
    font-size:35px;
    margin-bottom:30px;
    text-shadow:2px 2px 10px rgba(0,0,0,0.2);
}

button{
    padding:12px 28px;
    border:none;
    border-radius:15px;
    font-size:18px;
    cursor:pointer;
    margin:10px;
}

#yes{
    background:#ff4f9f;
    color:white;
    box-shadow:0 5px 15px rgba(255,79,159,0.4);
}

#no{
    background:white;
    color:#ff4f9f;
    position:absolute;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<div class="box">
    <h1>Kamu suka aku ga? ❤️</h1>

    <button id="yes">Iya Suka❤️</button>
    <button id="no">Ga Suka 😜</button>
</div>

<script>
const noBtn = document.getElementById("no");

function pindahTombol() {
    const x = Math.random() * (window.innerWidth - 120);
    const y = Math.random() * (window.innerHeight - 60);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

noBtn.addEventListener("mouseover", pindahTombol);
noBtn.addEventListener("click", pindahTombol);

document.getElementById("yes").addEventListener("click", () => {
    const nomor = "6285183376722";

    const pesan = encodeURIComponent(
        "Iyaa aku suka banget sama kamu, kamu mau ga jadi pacar aku💕❤✨"
    );

    window.location.href =
    `https://wa.me/${nomor}?text=${pesan}`;
});
</script>

</body>
</html>
