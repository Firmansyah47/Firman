<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baca Ini Penting!!!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,sans-serif;height:100vh;overflow:hidden;cursor:none}
.loading{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:10;background:#000}
.loading h1{font-size:24px;margin-bottom:20px;animation:pulse 1.5s infinite}
.loading p{color:#888}
@keyframes pulse{0%{opacity:0.3}50%{opacity:1}100%{opacity:0.3}}
.jumpscare{position:fixed;top:0;left:0;width:100%;height:100%;display:none;justify-content:center;align-items:center;z-index:20}
.jumpscare img{width:100%;height:100%;object-fit:cover;animation:shake 0.1s infinite}
@keyframes shake{0%{transform:translate(5px,5px)}25%{transform:translate(-5px,-5px)}50%{transform:translate(5px,-5px)}75%{transform:translate(-5px,5px)}100%{transform:translate(5px,5px)}}
.tombol-keluar{position:fixed;bottom:20px;right:20px;z-index:30;background:rgba(255,255,255,0.1);color:#fff;border:1px solid #fff;padding:10px 20px;border-radius:5px;display:none;cursor:pointer}
</style>
</head>
<body>
<div class="loading" id="loading">
<h1>⚠️ PERINGATAN</h1>
<p>Konten ini mengandung gambar penampakan Zo Kho Whei...</p>
<p>...</p>
</div>

<div class="jumpscare" id="jumpscare">
<img src="../hantu.jpg" alt="BOO">
</div>

<button class="tombol-keluar" id="keluar" onclick="window.close()">TUTUP</button>

<audio id="teriak" preload="auto">
<source src="https://www.myinstants.com/media/sounds/female-scream-1.mp3" type="audio/mpeg">
</audio>

<script>
const loading = document.getElementById('loading');
const jumpscare = document.getElementById('jumpscare');
const teriak = document.getElementById('teriak');
const keluar = document.getElementById('keluar');

// MULAI JUMPSCARE SETELAH 3 DETIK
setTimeout(() => {
    loading.style.display = 'none';
    jumpscare.style.display = 'flex';
    teriak.volume = 1.0;
    teriak.play();
    
    // Geter HP kalo support
    if (navigator.vibrate) {
        navigator.vibrate([500, 200, 500, 200, 1000]);
    }
    
    // Munculin tombol keluar setelah 4 detik
    setTimeout(() => {
        keluar.style.display = 'block';
    }, 4000);
}, 3000);

// Klik dimana aja buat fullscreen biar makin kaget
document.addEventListener('click', () => {
    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
    }
});
</script>
</body>
</html>
