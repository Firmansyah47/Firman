<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>🎁 HADIAH SPESIAL BUAT KAMU 🎁</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      animation: fadeIn 1s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    h1 {
      color: white;
      font-size: 3em;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .gift-box {
      width: 300px;
      height: 300px;
      margin: 30px auto;
      position: relative;
      cursor: pointer;
      animation: rotate 3s infinite;
    }

    @keyframes rotate {
      0%, 100% { transform: rotateY(0deg) rotateX(0deg); }
      25% { transform: rotateY(5deg) rotateX(5deg); }
      75% { transform: rotateY(-5deg) rotateX(-5deg); }
    }

    .gift-box:hover {
      animation: pulse 0.6s ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .box-main {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #ff6b9d 0%, #ff1493 100%);
      border-radius: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      position: relative;
      border: 5px solid #ffb6c1;
    }

    .box-main::before {
      content: '';
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 30px;
      background: linear-gradient(90deg, #ff69b4, #ff1493);
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .box-main::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 280px;
      height: 280px;
      border: 3px dashed rgba(255,255,255,0.5);
      border-radius: 25px;
      pointer-events: none;
    }

    .box-content {
      text-align: center;
      z-index: 2;
    }

    .box-content h2 {
      color: white;
      font-size: 2.5em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .box-content p {
      color: rgba(255,255,255,0.9);
      font-size: 1.2em;
      margin-bottom: 15px;
    }

    .click-text {
      color: #ffe4e1;
      font-size: 1em;
      font-weight: bold;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: 0.5; }
    }

    .sparkle {
      position: absolute;
      width: 10px;
      height: 10px;
      background: gold;
      border-radius: 50%;
      animation: sparkleAnim 2s infinite;
      pointer-events: none;
    }

    @keyframes sparkleAnim {
      0% { opacity: 0; transform: scale(0); }
      50% { opacity: 1; }
      100% { opacity: 0; transform: scale(1); }
    }

    /* Modal untuk foto */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      animation: fadeInModal 0.4s ease-in;
    }

    @keyframes fadeInModal {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      position: relative;
      text-align: center;
      animation: zoomIn 0.4s ease-in;
    }

    @keyframes zoomIn {
      from { transform: scale(0.5); }
      to { transform: scale(1); }
    }

    .modal img {
      max-width: 90vw;
      max-height: 80vh;
      border-radius: 20px;
      box-shadow: 0 0 50px rgba(255,255,255,0.3);
      cursor: pointer;
      transition: 0.3s;
    }

    .modal img:hover {
      transform: scale(1.05);
    }

    .modal-text {
      color: white;
      margin-top: 20px;
      font-size: 1.3em;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 40px;
      color: white;
      font-size: 3em;
      cursor: pointer;
      transition: 0.3s;
      text-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .close-btn:hover {
      transform: scale(1.2);
      color: #ff69b4;
    }

    .footer-text {
      color: white;
      margin-top: 30px;
      font-size: 1em;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎉 HADIAH SPESIAL BUAT KAMU 🎉</h1>
    
    <div class="gift-box" onclick="openGift()">
      <div class="box-main">
        <div class="box-content">
          <h2>🎁</h2>
          <p>Buka Hadiah</p>
          <p class="click-text">👆 Klik di sini!</p>
        </div>
      </div>
      <div class="sparkle" style="top: 10%; left: 10%;"></div>
      <div class="sparkle" style="top: 20%; right: 15%; animation-delay: 0.5s;"></div>
      <div class="sparkle" style="bottom: 15%; left: 20%; animation-delay: 1s;"></div>
      <div class="sparkle" style="bottom: 10%; right: 10%; animation-delay: 1.5s;"></div>
    </div>

    <p class="footer-text">✨ Tekan tombol hadiah untuk membuka kejutan ✨</p>
  </div>

  <!-- Modal untuk menampilkan foto -->
  <div class="modal" id="photoModal">
    <span class="close-btn" onclick="closeGift()">✕</span>
    <div class="modal-content">
      <img src="https://raw.githubusercontent.com/Firmansyah47/Firman/main/jumpscare.jpg" alt="Hadiah Spesial" onclick="enlargeImage(this)">
      <div class="modal-text">
        <h2>🎊 Kejutan Buat Kamu! 🎊</h2>
        <p>Semoga kamu suka yaaa 💖</p>
        <p style="font-size: 0.9em; margin-top: 10px;">Klik gambar untuk perbesar/perkecil</p>
      </div>
    </div>
  </div>

  <script>
    function openGift() {
      document.getElementById("photoModal").classList.add("active");
    }

    function closeGift() {
      document.getElementById("photoModal").classList.remove("active");
    }

    function enlargeImage(img) {
      if (img.style.maxWidth === "500px") {
        img.style.maxWidth = "90vw";
      } else {
        img.style.maxWidth = "500px";
      }
    }

    // Tutup modal jika klik di area luar gambar
    document.getElementById("photoModal").addEventListener("click", function(e) {
      if (e.target === this) {
        closeGift();
      }
    });
  </script>

</body>
</html>
