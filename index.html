<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Nindy ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: 'Segoe UI', sans-serif;
}

body{
background:linear-gradient(135deg,#ffb6c1,#ffc0cb,#ffd6e7);
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
}

.container{
width:90%;
max-width:800px;
background:rgba(255,255,255,.9);
backdrop-filter:blur(10px);
padding:30px;
border-radius:25px;
box-shadow:0 0 30px rgba(255,105,180,.3);
text-align:center;
z-index:10;
}

h1{
color:#ff4f87;
margin-bottom:15px;
}

#letter{
font-size:20px;
line-height:1.8;
color:#444;
min-height:320px;
white-space:pre-wrap;
text-align:left;
}

button{
background:#ff4f87;
color:white;
border:none;
padding:15px 30px;
border-radius:50px;
font-size:18px;
cursor:pointer;
margin-top:20px;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

.heart{
position:absolute;
color:white;
animation:fall linear forwards;
pointer-events:none;
}

@keyframes fall{
0%{
transform:translateY(-100px);
opacity:1;
}
100%{
transform:translateY(110vh);
opacity:0;
}
}

#final{
display:none;
margin-top:20px;
font-size:26px;
font-weight:bold;
color:#ff4f87;
}

</style>
</head>

<body>

<div class="container">

<h1>💌 Untuk Nindy ❤️</h1>

<div id="letter">
Ada sesuatu yang ingin Firman sampaikan...
</div>

<button id="startBtn">Buka Surat 💌</button>

<div id="final">
❤️ Terima kasih sudah membaca ❤️
</div>

</div>

<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>

const text = `Hai Nindy ❤️

Kalau kamu sedang membaca surat ini,
berarti ada sesuatu yang ingin aku sampaikan.

Mungkin ini bukan hadiah yang mahal.

Mungkin juga bukan sesuatu yang sempurna.

Tapi semua kata yang ada di sini
ditulis dengan tulus untuk kamu.

Aku cuma ingin mengingatkan satu hal.

Jangan terlalu keras pada dirimu sendiri.

Kamu sudah berusaha sejauh ini.

Kamu sudah melewati banyak hal yang tidak mudah.

Dan aku bangga karena kamu masih berdiri sampai hari ini.

Kalau suatu hari kamu merasa lelah,
istirahatlah.

Kalau suatu hari kamu merasa gagal,
cobalah lagi pelan-pelan.

Karena menurutku,
kamu jauh lebih kuat daripada yang kamu kira.

Terima kasih untuk setiap tawa.

Terima kasih untuk setiap cerita.

Dan terima kasih karena tanpa sadar
kamu pernah membuat hari-hariku lebih berwarna.

Aku tidak tahu bagaimana masa depan nanti.

Tapi aku senang karena pernah mengenal seseorang sebaik kamu.

Jangan pernah meragukan dirimu sendiri ya, Nindy.

Tetaplah menjadi dirimu sendiri.

Karena itulah versi yang paling berharga.

Semoga semua impianmu tercapai.

Semoga langkahmu selalu dipenuhi hal-hal baik.

Dan semoga kamu selalu bahagia ❤️

Dengan tulus,

Firman ❤️`;

const letter = document.getElementById("letter");
const btn = document.getElementById("startBtn");
const music = document.getElementById("music");

btn.addEventListener("click", () => {

music.play();

btn.style.display = "none";

letter.innerHTML = "";

let i = 0;

function typeWriter(){

if(i < text.length){

letter.innerHTML += text.charAt(i);

i++;

setTimeout(typeWriter, 45);

}else{

document.getElementById("final").style.display="block";

burstHearts();

}

}

typeWriter();

});

function createHeart(){

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(15+Math.random()*25)+"px";

heart.style.animationDuration=(4+Math.random()*4)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},8000);

}

setInterval(createHeart,350);

function burstHearts(){

for(let i=0;i<120;i++){

setTimeout(()=>{
createHeart();
},i*40);

}

}

</script>

</body>
</html>
