<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Untuk Kamu 💖</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ffb6c1, #ff69b4);
      font-family: Arial, sans-serif;
      overflow: hidden;
      text-align: center;
      color: white;
    }

    .box {
      margin-top: 120px;
    }

    h1 {
      font-size: 40px;
      animation: fadeIn 2s ease-in-out;
    }

    p {
      font-size: 20px;
      margin: 20px;
    }

    button {
      padding: 12px 25px;
      border: none;
      border-radius: 20px;
      background: white;
      color: #ff1493;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.1);
    }

    .love {
      position: absolute;
      color: red;
      font-size: 20px;
      animation: floatUp 4s linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh);
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh);
        opacity: 0;
      }
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Hai Kamu 💖</h1>
    <p id="text">Aku punya sesuatu buat kamu...</p>
    <button onclick="ubah()">Klik Aku 💌</button>
  </div>

  <script>
    const pesan = [
      "Kamu itu spesial banget 💖",
      "Aku bersyukur kenal kamu 😊",
      "Kalau kamu baca ini, berarti kamu lagi di pikiranku 😳",
      "Aku cuma mau bilang... aku sayang kamu 💕"
    ];

    let i = 0;

    function ubah() {
      document.getElementById("text").innerText = pesan[i];
      i = (i + 1) % pesan.length;
      buatLove();
    }

    function buatLove() {
      for (let j = 0; j < 10; j++) {
        let love = document.createElement("div");
        love.className = "love";
        love.innerHTML = "💖";
        love.style.left = Math.random() * 100 + "vw";
        love.style.fontSize = Math.random() * 20 + 10 + "px";
        document.body.appendChild(love);

        setTimeout(() => {
          love.remove();
        }, 4000);
      }
    }
  </script>

</body>
</html>
